    <text transform="matrix(1 0 0 1 44 48)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="20" fill="#f9fafb"><tspan x="0" y="0">PURE-CTWBW — Split-Precision Blackwell Pipeline &amp; Standalone GPU Options</tspan></text>
    <text transform="matrix(1 0 0 1 44 72)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#9ca3af"><tspan x="0" y="0">Runs 100% Standalone on Any Single Supported Blackwell GPU · Bit-for-Bit Parity (max_abs_diff = 0.0) · Up to 37.4% Less VRAM</tspan></text>
    <text transform="matrix(1 0 0 1 38 134)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="13" fill="#22d3ee"><tspan x="0" y="0">1. Input &amp; Patch-14 Prep</tspan></text>
    <text transform="matrix(1 0 0 1 38 158)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• Video / Multi-View Images (2–96+f)</tspan><tspan x="0" y="12">• Aspect-Preserving Center Crop</tspan><tspan x="0" y="24">• Patch-14 Budget (518 × 294 px)</tspan><tspan x="0" y="36">• Zero Teacher Models at Inference</tspan><tspan x="0" y="48">• 100% Local Disk Weight Resolution</tspan><tspan x="0" y="60">  (PURE_MODEL_ROOT)</tspan></text>
    <text transform="matrix(1 0 0 1 298 134)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="13" fill="#34d399"><tspan x="0" y="0">2. Native BF16 Backbone</tspan></text>
    <text transform="matrix(1 0 0 1 298 158)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• Pre-Cast Linear/Conv2d to BF16</tspan><tspan x="0" y="12">• LayerNorm/RMSNorm Kept in FP32</tspan><tspan x="0" y="24">• Static Weights Halved (-45% to -48%)</tspan><tspan x="0" y="36">• Blackwell FlashAttention-2 SDPA</tspan><tspan x="0" y="48">• O(N) Multi-View Memory Scaling</tspan><tspan x="0" y="60">• Eliminates Temporary Cast Buffers</tspan></text>
    <text transform="matrix(1 0 0 1 574 134)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="13" fill="#fbbf24"><tspan x="0" y="0">3. Exact FP32 Pose &amp; Depth</tspan></text>
    <text transform="matrix(1 0 0 1 574 158)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• autocast(enabled=False) Heads</tspan><tspan x="0" y="12">• DualDPT / DepthRefiner / CameraDec</tspan><tspan x="0" y="24">• Sub-Millimeter SE(3) Pose Stability</tspan><tspan x="0" y="36">• Unconditional Checkpoint Bypass</tspan><tspan x="0" y="48">  During torch.inference_mode()</tspan><tspan x="0" y="60">• max_abs_diff = 0.0 vs. Upstream</tspan></text>
    <text transform="matrix(1 0 0 1 850 134)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="13" fill="#c4b5fd"><tspan x="0" y="0">4. Page Reclaim &amp; Export</tspan></text>
    <text transform="matrix(1 0 0 1 850 158)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• Inter-Stage empty_cache() Reclaim</tspan><tspan x="0" y="12">• expandable_segments:True Virtual VM</tspan><tspan x="0" y="24">• Offline SegFormer-B2 Sky Masking</tspan><tspan x="0" y="36">• Exports: points_no_sky.ply (7.31M),</tspan><tspan x="0" y="48">  preview.glb (150k), cameras.npz,</tspan><tspan x="0" y="60">  depth.mp4 &amp; reconstruction.zip</tspan></text>
    <text transform="matrix(1 0 0 1 44 344)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#34d399"><tspan x="0" y="0">Standalone Option A: GeForce RTX 5070 Ti (16 GB GDDR7 · Desktop x86_64)</tspan></text>
    <text transform="matrix(1 0 0 1 44 372)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">• Runs 100% Standalone on a Single 16 GB Desktop GPU (No Cluster Required)</tspan><tspan x="0" y="13.2">• Shared Mode (~12–13 GiB Free): Runs ALL 3 models at full 48-frame Studio max</tspan><tspan x="0" y="26.4">• Dedicated Mode (16.0 GiB Full GPU): Unlocks 64–96+ frame CLI reconstructions</tspan><tspan x="0" y="39.6">• Replaces Upstream 24 GB A10G Requirement: Saves up to 3.79 GiB VRAM on DA3</tspan><tspan x="0" y="52.8">• High Desktop GDDR7 Bandwidth (672 GB/s) &amp; Boost Clocks for Fast Single Runs</tspan></text>
    <text transform="matrix(1 0 0 1 580 344)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#22d3ee"><tspan x="0" y="0">Standalone Option B: NVIDIA DGX Spark GB10 (128 GB Unified · ARM64)</tspan></text>
    <text transform="matrix(1 0 0 1 580 372)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">• Runs 100% Standalone on a Single Grace Blackwell Superchip (No Cluster Required)</tspan><tspan x="0" y="13.2">• 48-Frame Studio Peak Memory: 5.26 GiB (vggt) · 6.34 GiB (da3) · 6.87 GiB (pi3)</tspan><tspan x="0" y="26.4">• 48-Frame Latency: 5.44 s (vggt) · 5.94 s (da3) · 8.21 s (pi3)</tspan><tspan x="0" y="39.6">• Ultra-Long Sequence CLI Capacity: 96–250+ consecutive frames on one node</tspan><tspan x="0" y="52.8">• Always-On Server Headroom: Coexists with TTS, ASR &amp; DiT workloads effortlessly</tspan></text>
  </g>
