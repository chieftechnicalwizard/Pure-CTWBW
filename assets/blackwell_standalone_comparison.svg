    <text transform="matrix(1 0 0 1 44 48)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="20" fill="#f9fafb"><tspan x="0" y="0">PURE-CTWBW — Standalone Deployment Comparison: RTX 5070 Ti vs. DGX Spark GB10</tspan></text>
    <text transform="matrix(1 0 0 1 44 72)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#9ca3af"><tspan x="0" y="0">Each Option Is a Complete, Self-Contained Single-GPU Deployment — Choose Either Hardware Target Independently</tspan></text>
    <text transform="matrix(1 0 0 1 44 140)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#f3f4f6"><tspan x="0" y="0">48-Frame Peak Memory Usage vs. Total Pool (DA3-Giant 6.34 GiB)</tspan></text>
    <text transform="matrix(1 0 0 1 44 194)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">RTX 5070 Ti (16 GB)</tspan></text>
    <text transform="matrix(1 0 0 1 200 194)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="none"><tspan x="0" y="0">39.6% Used (6.34 / 16.0 GiB) — 9.66 GiB Free!</tspan></text>
    <text transform="matrix(1 0 0 1 44 238)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">DGX Spark GB10 (128 GB)</tspan></text>
    <text transform="matrix(1 0 0 1 214 238)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#22d3ee"><tspan x="0" y="0">5.0% Used (6.34 / 128.0 GiB) — 121.6 GiB Free!</tspan></text>
    <text transform="matrix(1 0 0 1 44 292)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#f3f4f6"><tspan x="0" y="0">Maximum Consecutive Frame Sequence Ceiling (Single GPU)</tspan></text>
    <text transform="matrix(1 0 0 1 44 334)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">5070 Ti (Shared)</tspan></text>
    <text transform="matrix(1 0 0 1 294 334)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#34d399"><tspan x="0" y="0">48–64 Frames (Full Studio Max)</tspan></text>
    <text transform="matrix(1 0 0 1 44 374)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">5070 Ti (Dedicated)</tspan></text>
    <text transform="matrix(1 0 0 1 342 374)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#34d399"><tspan x="0" y="0">64–96+ Frames (Long CLI)</tspan></text>
    <text transform="matrix(1 0 0 1 44 414)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#e5e7eb"><tspan x="0" y="0">DGX Spark GB10</tspan></text>
    <text transform="matrix(1 0 0 1 200 414)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="11" fill="#f9fafb"><tspan x="0" y="0">96–250+ Frames (Ultra-Long CLI)</tspan></text>
    <text transform="matrix(1 0 0 1 44 456)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#9ca3af"><tspan x="0" y="0">Both GPUs run all 3 backbones (pi3, da3, vggt) + SegFormer-B2 at full 48-frame Studio max.</tspan></text>
    <text transform="matrix(1 0 0 1 580 140)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="14" fill="#f3f4f6"><tspan x="0" y="0">Which Standalone Blackwell Target Should You Choose?</tspan></text>
    <text transform="matrix(1 0 0 1 580 176)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="12" fill="#34d399"><tspan x="0" y="0">Choose Option A: GeForce RTX 5070 Ti (16 GB) When:</tspan></text>
    <text transform="matrix(1 0 0 1 580 198)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• You are running on a standard x86_64 Linux desktop or workstation</tspan><tspan x="0" y="12">• You want full 48-frame Studio web reconstructions (5.26–6.87 GiB peak)</tspan><tspan x="0" y="24">  without needing an expensive 24 GB+ datacenter GPU</tspan><tspan x="0" y="36">• You want high GDDR7 bandwidth (672 GB/s) and desktop SM boost clocks</tspan><tspan x="0" y="48">  for snappy interactive single-user reconstructions (2–96 frames)</tspan><tspan x="0" y="60">• You optionally co-host lightweight services (~12–13 GiB free VRAM) or</tspan><tspan x="0" y="72">  dedicate the full 16 GB GPU on-demand for 64–96+ frame CLI batches</tspan></text>
    <text transform="matrix(1 0 0 1 580 324)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="12" fill="#22d3ee"><tspan x="0" y="0">Choose Option B: NVIDIA DGX Spark GB10 (128 GB) When:</tspan></text>
    <text transform="matrix(1 0 0 1 580 346)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#e5e7eb"><tspan x="0" y="0">• You want an always-on, low-power ARM64 3D Reconstruction Studio server</tspan><tspan x="0" y="12">• You need ultra-long single-pass CLI reconstructions (96–250+ frames)</tspan><tspan x="0" y="24">  that exceed 16–24 GB discrete GPU memory limits</tspan><tspan x="0" y="36">• You keep multiple large foundation models (TTS, ASR, DiT, VLM) resident</tspan><tspan x="0" y="48">  in 128 GB unified memory 24/7 alongside PURE Studio without unloading</tspan></text>
    <text transform="matrix(1 0 0 1 324 194)" x="0" y="0" xml:space="preserve" font-family="&apos;Source Sans 3&apos;" font-size="10" fill="#34d399"><tspan x="0" y="0">39.6% Used (6.34 GiB) — 9.66 GiB Free!</tspan></text>
